[package]
name = "paraco"
version = "0.1.0"
edition = "2024"
description = "Local-first portable application runtime"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
