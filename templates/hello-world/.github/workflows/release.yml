name: Release app package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test app
        run: deno test
      - name: Package app
        run: python3 scripts/package.py --version "${GITHUB_REF_NAME#v}" --output dist/hello-world.paraco.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hello-world.paraco.json --generate-notes
