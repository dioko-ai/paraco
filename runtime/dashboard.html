<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Paraco — Local apps</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;color:#193329;background:#f5f7f2}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:56px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d7dfd4;padding-bottom:24px}.brand{font-size:24px;font-weight:750;letter-spacing:-1px}.local{font-size:13px;border:1px solid #c9d6c8;border-radius:30px;padding:8px 12px}.intro{margin:48px 0 30px}h1{font-size:38px;letter-spacing:-1.5px;margin:0 0 10px}.intro p,footer{color:#59695b}ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}.app{display:grid;grid-template-columns:1fr auto;gap:18px;background:white;border:1px solid #dae2d7;border-radius:12px;padding:24px}h2{font-size:18px;margin:0 0 6px}.path{font-family:monospace;color:#677968;margin:0;font-size:13px}.status{font-size:12px;align-self:start;border-radius:20px;padding:5px 10px;text-transform:capitalize}.running{color:#215b36;background:#e3f3e6}.starting{color:#725918;background:#faf0cf}.failed{color:#a13030;background:#fbe7e4}.detail{grid-column:1/-1;font-size:14px;overflow-wrap:anywhere}a{color:#286444;text-underline-offset:4px}a:hover{color:#123a21}a:focus-visible{outline:2px solid #286444;outline-offset:5px}footer{font-size:12px;margin-top:28px;line-height:1.8}.empty{padding:28px;border:1px dashed #bdcbb8;border-radius:12px}@media(max-width:480px){main{padding:28px 18px}h1{font-size:32px}.intro{margin-top:32px}.app{padding:18px}.local{font-size:11px}}
</style>
</head>
<body><main>
<header><div class="brand">paraco<span style="color:#67996a">.</span></div><span class="local">On this device</span></header>
<section class="intro"><h1>Your local apps</h1><p>{{summary}}</p></section>
<ul aria-label="Applications">{{apps}}</ul>
<footer>Status refreshes every 5 seconds. Running indicates the app process is serving; it is not a health check.</footer>
</main></body></html>
