name: Native containment validation

# Exercise native containment on both supported platforms.
on:
  workflow_dispatch:

jobs:
  containment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo build --locked
      - name: Exercise native and real runtime boundaries
        shell: bash
        run: |
          unset PARACO_ALLOW_UNSANDBOXED
          mkdir -p verification-artifacts/native-containment
          set -o pipefail
          target/debug/paraco sandbox-check | tee verification-artifacts/native-containment/native.json
          npm run test:sandbox-probe 2>&1 | tee verification-artifacts/native-containment/report-tests.log
          node --test tests/sandbox-probe-runtime.cjs 2>&1 | tee verification-artifacts/native-containment/runtime.log
          node tests/workerd-security.cjs 2>&1 | tee verification-artifacts/native-containment/security.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-containment-${{ runner.os }}-${{ runner.arch }}
          path: verification-artifacts/native-containment/
