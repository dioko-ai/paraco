name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Run verification and retain result
        run: |
          mkdir -p verification-artifacts
          set +e
          npm run check 2>&1 | tee verification-artifacts/check.log
          status=${PIPESTATUS[0]}
          printf 'npm run check exit status: %s\n' "$status" > verification-artifacts/result.txt
          exit "$status"
      - name: Verify workloads, storage restoration, and offline preparation
        run: |
          set -o pipefail
          python3 scripts/verify-foundation.py 2>&1 | tee verification-artifacts/foundation.log
          python3 scripts/verify-prepared.py 2>&1 | tee verification-artifacts/prepared.log
      - name: Verify native archive composition
        run: |
          npm run test:installer
          bash tests/build-bundle.sh
          npm run test:release
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          echo 'TEST FIXTURE ONLY: not a distributable third-party notice.' > "$fixture_dir/notice"
          bash tests/bundle-smoke.sh --deno "$(command -v deno)" --deno-notice "$fixture_dir/notice" --third-party-notice "$fixture_dir/notice" --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Retain verification environment
        if: always()
        run: |
          mkdir -p verification-artifacts
          { rustc --version; deno --version; node --version; npx playwright --version; uname -a; } > verification-artifacts/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}-${{ runner.arch }}
          path: verification-artifacts/

  dependency-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
