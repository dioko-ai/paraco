name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

# Supersede older PR checks; keep default-branch and manual runs independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: rust-${{ matrix.os }}-${{ runner.arch }}-1.96.1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/**', 'rust-toolchain*', '.github/workflows/ci.yml') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Expose pinned native tools
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install Linux containment
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Explicit trusted development tests on macOS
        if: runner.os == 'macOS'
        run: |
          echo 'PARACO_ALLOW_UNSANDBOXED=1' >> "$GITHUB_ENV"
          # Nested socket fixtures must fit macOS's 104-byte Unix socket path limit.
          echo 'TMPDIR=/tmp' >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Run verification and retain result
        run: |
          mkdir -p verification-artifacts
          set +e
          npm run check 2>&1 | tee verification-artifacts/check.log
          status=${PIPESTATUS[0]}
          printf 'npm run check exit status: %s\n' "$status" > verification-artifacts/result.txt
          exit "$status"
      - name: Verify workloads, storage restoration, and offline preparation
        run: |
          set -o pipefail
          python3 scripts/verify-foundation.py 2>&1 | tee verification-artifacts/foundation.log
          python3 scripts/verify-prepared.py 2>&1 | tee verification-artifacts/prepared.log
          python3 scripts/verify-marketplace.py 2>&1 | tee verification-artifacts/marketplace.log
          python3 scripts/verify-showcase-marketplace.py 2>&1 | tee verification-artifacts/showcase-marketplace.log
          node --experimental-strip-types --test templates/hello-world/main_test.ts
      - name: Verify native archive composition
        run: |
          npm run test:installer
          bash tests/build-bundle.sh
          npm run test:release
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          echo 'TEST FIXTURE ONLY: not a distributable third-party notice.' > "$fixture_dir/notice"
          esbuild_bin="node_modules/@esbuild/$(node -p '`${process.platform}-${process.arch}`')/bin/esbuild"
          bash tests/bundle-smoke.sh --workerd "$(command -v workerd)" --esbuild "$esbuild_bin" --workerd-notice "$fixture_dir/notice" --compiler-notice "$fixture_dir/notice" --third-party-notice "$fixture_dir/notice" --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Retain verification environment
        if: always()
        run: |
          mkdir -p verification-artifacts
          { rustc --version; workerd --version; node_modules/@esbuild/$(node -p '`${process.platform}-${process.arch}`')/bin/esbuild --version; node --version; npx playwright --version; uname -a; } > verification-artifacts/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}-${{ runner.arch }}
          path: verification-artifacts/

  dependency-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: Cache pinned cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-rust-1.96.1-v0.22.2
      - if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
